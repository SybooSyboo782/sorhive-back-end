server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    #driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: org.h2.Driver
    #url: RDBMS_URL
    #username: comproject
    #password: comproject
    hikari:
      auto-commit: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: true
  data:
    mongodb:
      #uri: NOSQL_URI
      #uri: mongodb://localhost:27017/
      host: localhost
      port: 27017
      database: comproject
      #authentication-database: admin
      #database: comproject
    web:
      pageable:
        default-page-size: 10
        max-page-size: 2000
  jpa:
    generate-ddl: false
    show-sql: true
    #database: mysql
    #database-platform: org.hibernate.dialect.MySQL5InnoDBDialect
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        use_sql_comments: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    check-template-location: true
    cache: false
  mail:
    default-encoding: UTF-8
    host: smtp.naver.com #smtp 서버 주소
    port: 465 # 메일 인증서버 포트
    username: MAIL_USER_ID #네이버 아이디
    password: MAIL_USER_PW #네이버 비밀번호
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
          timeout: 5000
          ssl:
            trust: smtp.naver.com
            enable: true

jwt:
  secret: Y29tcHJvamVjdHNlY3JldGtleTc4MmNvbXByb2plY3RzZWNyZXRrZXk=
  #secret: JWT_SECRET

logging:
  level:
    root: info
    com:
      amazonaws:
        util:
          EC2MetadataUtils: error

cloud:
  aws:
    s3:
      bucket: AWS_S3_BUCKET
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      instanceProfile: true

url:
  avatar: AI_AVATAR
  lifing: AI_LIFING

mybatis:
  mapper-locations: mybatis/**/*.xml
  type-aliases-package: com.sorhive.comproject
  configuration:
    map-underscore-to-camel-case: true

custom:
  default-room-code: 637c67b716de470e1cecef26
  default-mongoroom-code: 637befb055f63397c8692bb2